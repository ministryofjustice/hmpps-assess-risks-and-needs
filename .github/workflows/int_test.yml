name: Integration Test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: string
        required: true
        default: 'dev'
  workflow_call:
    inputs:
      environment:
        description: Environment
        type: string
        required: true
        default: 'dev'

permissions:
  contents: read

jobs:
  inttest:
    if: ${{ inputs.environment == 'dev' || inputs.environment == 'test' }}
    runs-on: [ self-hosted, hmpps-github-actions-runner ]
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: java --version
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run integration tests
        run: ./gradlew integrationTest
        env:
          AAP_CLIENT_ID: ${{ secrets.ARNS_ASSESSMENT_CLIENT_ID }}
          AAP_CLIENT_SECRET: ${{ secrets.ARNS_ASSESSMENT_CLIENT_SECRET }}
          ARNS_TEST_BASE_URL: ${{ fromJSON(vars.INT_TEST_DATA)[inputs.environment].url }}
          ARNS_TEST_API_CRN: ${{ fromJSON(vars.INT_TEST_DATA)[inputs.environment].crn }}

      - name: Upload test results
        if: '!cancelled()'
        uses: actions/upload-artifact@v5
        with:
          name: test_results
          path: |
            build/test_results
            build/reports/tests
      
      - name: Slack notification
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        env:
          SLACK_CHANNEL: ${{ vars.INTEGRATION_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
          REPO_NAME: ${{ github.repository }}
          SLACK_BOT_TOKEN: ${{ secrets.HMPPS_SLACK_BOT_TOKEN }}
        with:
          method: chat.postMessage
          token: ${{ secrets.HMPPS_SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "text": "🚨 ${{ inputs.environment }} - API Smoke Tests Failed",
              "attachments": [
               {
                 "color": "#FF0000",
                 "text": ":x: *API Smoke tests notification*\nWorkflow failed on ${{ inputs.environment }} environment for ${{ env.REPO_NAME }}"
                }
              ]
            }
